<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030305" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background Dark Squircle -->
  <rect width="512" height="512" rx="128" fill="#040407"/>
  <circle cx="256" cy="256" r="220" fill="url(#spaceGlow)"/>
  <circle cx="256" cy="256" r="210" stroke="url(#cyanGrad)" stroke-width="6" fill="none" opacity="0.4" stroke-dasharray="16 8"/>

  <!-- Orbit Rings -->
  <ellipse cx="256" cy="256" rx="190" ry="85" stroke="url(#cyanGrad)" stroke-width="4" fill="none" transform="rotate(-30 256 256)" opacity="0.8"/>
  <circle cx="390" cy="180" r="12" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="120" cy="330" r="7" fill="#10b981" filter="url(#glow)"/>

  <!-- Central 'H' Monogram & Camera Shutter Geometry -->
  <g filter="url(#glow)">
    <!-- Left Pillar -->
    <path d="M 175 140 L 205 140 L 205 372 L 175 372 Z" fill="url(#cyanGrad)"/>
    <!-- Right Pillar -->
    <path d="M 307 140 L 337 140 L 337 372 L 307 372 Z" fill="url(#cyanGrad)"/>
    <!-- Crossbar -->
    <path d="M 205 240 L 307 240 L 307 272 L 205 272 Z" fill="url(#cyanGrad)"/>
    <!-- Center Floating Core -->
    <circle cx="256" cy="256" r="18" fill="#ffffff"/>
    <circle cx="256" cy="256" r="8" fill="#040407"/>
  </g>
</svg>
