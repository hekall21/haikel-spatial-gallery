<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Recorder - Perekam Layar Laptop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #08080c;
      color: #f1f1f1;
      font-family: 'Space Grotesk', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .card {
      background: rgba(22, 22, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 680px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
      backdrop-filter: blur(16px);
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      color: #8f8f9d;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    .timer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.5rem;
      color: #ef4444;
      margin: 1.5rem 0;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
    }
    .pulse-dot {
      width: 14px;
      height: 14px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.3; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1.15); }
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      align-items: center;
    }
    .options {
      display: flex;
      gap: 1.5rem;
      font-size: 0.9rem;
      color: #b3b3b3;
      margin-bottom: 0.5rem;
    }
    .options label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }
    .btn {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      padding: 1rem 2.4rem;
      border-radius: 40px;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
    }
    .btn-start {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
    }
    .btn-start:hover {
      transform: scale(1.04);
      background: #eaeaea;
    }
    .btn-stop {
      background: #ef4444;
      color: #ffffff;
      display: none;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.35);
    }
    .btn-stop:hover {
      transform: scale(1.04);
      background: #dc2626;
    }
    .preview-box {
      margin-top: 2rem;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    video {
      width: 100%;
      max-height: 280px;
      border-radius: 12px;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .download-btn {
      background: #22c55e;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.8rem 1.8rem;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }
    .download-btn:hover {
      background: #16a34a;
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎬 Perekam Layar Laptop</h1>
    <p>Klik tombol di bawah, pilih <strong>Seluruh Layar</strong> atau <strong>Tab Browser</strong> yang mau direkam.</p>

    <div class="timer" id="timerBox">
      <div class="pulse-dot"></div>
      <span id="timerText">00:00</span>
    </div>

    <div class="controls">
      <div class="options">
        <label>
          <input type="checkbox" id="micToggle" checked> Rekam Suara Mikrofon (Audio Bicara)
        </label>
      </div>

      <button class="btn btn-start" id="startBtn">🔴 MULAI REKAM LAYAR</button>
      <button class="btn btn-stop" id="stopBtn">⏹ SELESAI & SIMPAN REKAMAN</button>
    </div>

    <div class="preview-box" id="previewBox">
      <h3 style="font-size: 1rem; color: #22c55e;">✅ Rekaman Selesai!</h3>
      <video id="recordedVideo" controls></video>
      <a href="#" class="download-btn" id="downloadBtn">📥 Download Video Rekaman (.webm / .mp4)</a>
    </div>
  </div>

  <script>
    let mediaRecorder;
    let recordedChunks = [];
    let timerInterval;
    let secondsElapsed = 0;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const timerBox = document.getElementById('timerBox');
    const timerText = document.getElementById('timerText');
    const previewBox = document.getElementById('previewBox');
    const recordedVideo = document.getElementById('recordedVideo');
    const downloadBtn = document.getElementById('downloadBtn');
    const micToggle = document.getElementById('micToggle');

    startBtn.addEventListener('click', async () => {
      try {
        recordedChunks = [];
        previewBox.style.display = 'none';

        // 1. Dapatkan display stream (layar + sistem audio)
        const displayStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 60, max: 60 } },
          audio: true
        });

        let combinedStream = displayStream;

        // 2. Gabungkan mic jika diaktifkan
        if (micToggle.checked) {
          try {
            const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const dest = audioCtx.createMediaStreamDestination();

            if (displayStream.getAudioTracks().length > 0) {
              const sysSource = audioCtx.createMediaStreamSource(displayStream);
              sysSource.connect(dest);
            }
            const micSource = audioCtx.createMediaStreamSource(micStream);
            micSource.connect(dest);

            combinedStream = new MediaStream([
              ...displayStream.getVideoTracks(),
              ...dest.stream.getAudioTracks()
            ]);
          } catch(e) {
            console.warn("Mikrofon dilewati:", e);
          }
        }

        // 3. Setup recorder
        const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
        mediaRecorder = new MediaRecorder(combinedStream, { mimeType });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          clearInterval(timerInterval);
          timerBox.style.display = 'none';
          startBtn.style.display = 'inline-flex';
          stopBtn.style.display = 'none';

          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          recordedVideo.src = url;
          downloadBtn.href = url;
          downloadBtn.download = `Rekaman-Layar-${Date.now()}.webm`;
          previewBox.style.display = 'flex';

          combinedStream.getTracks().forEach(t => t.stop());
        };

        // Jika user klik "Stop sharing" dari banner browser
        displayStream.getVideoTracks()[0].onended = () => {
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
          }
        };

        mediaRecorder.start(200);

        // Update UI
        startBtn.style.display = 'none';
        stopBtn.style.display = 'inline-flex';
        timerBox.style.display = 'flex';
        secondsElapsed = 0;
        timerText.textContent = "00:00";

        timerInterval = setInterval(() => {
          secondsElapsed++;
          const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
          const secs = (secondsElapsed % 60).toString().padStart(2, '0');
          timerText.textContent = `${mins}:${secs}`;
        }, 1000);

      } catch (err) {
        alert("Gagal memulai perekaman: " + err.message);
      }
    });

    stopBtn.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    });
  </script>
</body>
</html>
